
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
debug_tool = esp-builtin
build_type = debug
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DCONFIG_LOG_MAXIMUM_LEVEL_VERBOSE=y
    -DCONFIG_LOG_MAXIMUM_LEVEL=5
lib_deps =
    ArduinoJson
    ; EasyWiFi from this repo (symlink to the library root two levels up).
    ; Consumers outside this repo should instead use:
    ;   https://github.com/brennanMKE/EasyWiFi.git#v0.2.0
    symlink://../..
